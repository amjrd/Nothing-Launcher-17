name: Nothing OS Launcher - Lawnchair Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lawnchair-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair for Nothing OS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download official Lawnchair source
        run: |
          git clone \
            --branch 16-dev \
            --recurse-submodules \
            https://github.com/LawnchairLauncher/lawnchair.git \
            lawnchair-src

      - name: Verify Gradle Wrapper
        working-directory: lawnchair-src
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Gradle Wrapper is missing from Lawnchair source."
            exit 1
          fi

          chmod +x gradlew
          echo "Gradle Wrapper found."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lawnchair APK
        working-directory: lawnchair-src
        run: |
          ./gradlew \
            --no-daemon \
            assembleLawnWithQuickstepGithubDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-OS-Lawnchair-Debug
          path: lawnchair-src/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
