name: Lawnchair 16 - Nothing OS Widgets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nothing-launcher-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build Lawnchair with Nothing OS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Nothing OS Source
        uses: actions/checkout@v4
        with:
          repository: amjrd/Nathing-os-5
          ref: main
          path: nathing-source
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Sync Nothing OS Sources and Resources
        shell: bash
        run: |
          set -e
          echo "=== البدء في دمج ملفات Nothing OS مع Lawnchair ==="

          SRC_BASE="nathing-source/app/src/main"
          DST_BASE="lawnchair-src/lawnchair/src"

          # 1. تحديد مسار الكود المصدري في Nothing
          if [ -d "$SRC_BASE/java/com/example" ]; then
            SRC_CODE="$SRC_BASE/java/com/example"
          elif [ -d "$SRC_BASE/kotlin/com/example" ]; then
            SRC_CODE="$SRC_BASE/kotlin/com/example"
          else
            echo "::warning::لم يتم العثور على com/example، جاري البحث عن ملفات الودجات..."
            SRC_CODE=$(find "$SRC_BASE" -type d -name "components" | head -n 1 | sed 's|/ui/components||')
          fi

          echo "المصدر المكتشف: $SRC_CODE"

          # 2. تحديد المجلد الهدف في Lawnchair
          mkdir -p "$DST_BASE/com/example"

          # 3. نسخ مجلدات الكود الأساسية
          for dir in ui model service util; do
            if [ -d "$SRC_CODE/$dir" ]; then
              mkdir -p "$DST_BASE/com/example/$dir"
              cp -rf "$SRC_CODE/$dir/"* "$DST_BASE/com/example/$dir/"
              echo "تم نسخ: $dir"
            fi
          done

          # 4. نسخ الموارد (Drawables, Colors, Strings, Fonts) لمنع خطأ Unresolved reference: R
          if [ -d "$SRC_BASE/res" ]; then
            echo "جاري دمج ملفات الموارد (res)..."
            LAWN_RES="lawnchair-src/lawnchair/res"
            if [ ! -d "$LAWN_RES" ]; then
              LAWN_RES="lawnchair-src/lawnchair/src/main/res"
            fi

            if [ -d "$LAWN_RES" ]; then
              # نسخ الموارد بدون استبدال الملفات الأساسية للـ Launcher
              cp -rn "$SRC_BASE/res/"* "$LAWN_RES/" || true
              echo "تم دمج الموارد بنجاح."
            fi
          fi

          echo "=== اكتمال دمج الملفات بنجاح ==="

      - name: Verify Lawnchair Gradle Environment
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          echo "التحقق من مهام Gradle المتاحة..."
          ./gradlew tasks --group="build" || true

      - name: Build Lawnchair APK
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -o pipefail

          TARGET_TASK="assembleLawnWithQuickstepGithubDebug"

          # التأكد مما إذا كانت المهمة موجودة أو استخدام البديل المتوفر
          if ! ./gradlew tasks --all | grep -q "$TARGET_TASK"; then
            echo "المهمة $TARGET_TASK غير متوفرة، تجربة assembleLawnWithQuickstepDebug..."
            TARGET_TASK="assembleLawnWithQuickstepDebug"
          fi

          if ! ./gradlew tasks --all | grep -q "$TARGET_TASK"; then
            echo "تجربة assembleDebug كخيار عام..."
            TARGET_TASK="assembleDebug"
          fi

          echo "المهمة التي سيتم تنفيذها: $TARGET_TASK"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            $TARGET_TASK 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Process Build Diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          if [ -f build-full.log ]; then
            {
              echo "## تقرير بناء التطبيق (Build Diagnostics)"
              echo
              echo "### الأخطاء المكتشفة (إن وجدت):"
              echo '```text'
              grep -n -E '(^e: |error:|Unresolved reference|What went wrong|Compilation error|FAILURE: Build failed)' build-full.log | tail -n 100 || echo "لم يتم العثور على أخطاء صريحة."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            cp build-full.log diagnostics/
          fi

      - name: Upload Launcher APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Lawnchair-16-APK
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostics Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics-Log
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
