name: Lawnchair 16 - Nothing OS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lawnchair-nothing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair for Pixel Android 17
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout official Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive

      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "Checking project..."
          test -d project

          echo "Checking Lawnchair source..."
          test -f lawnchair-src/gradlew

          if [ ! -f lawnchair-src/settings.gradle.kts ] && \
             [ ! -f lawnchair-src/settings.gradle ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          chmod +x lawnchair-src/gradlew

          echo "Source verification completed."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show available build tasks
        working-directory: lawnchair-src
        run: |
          ./gradlew --no-daemon tasks --all \
            > ../project/available-tasks.txt

          grep -i "assembleLawnWithQuickstepGithubDebug" \
            ../project/available-tasks.txt || true

      - name: Build Lawnchair
        working-directory: lawnchair-src
        run: |
          ./gradlew \
            --no-daemon \
            assembleLawnWithQuickstepGithubDebug \
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-NothingOS-Debug
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Build-Diagnostics
          path: |
            project/available-tasks.txt
            lawnchair-src/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
