name: Lawnchair 16 - Nothing OS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lawnchair-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout official Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive

      - name: Verify Lawnchair source
        working-directory: lawnchair-src
        shell: bash
        run: |
          echo "Checking official Lawnchair source..."

          if [ ! -f "./gradlew" ]; then
            echo "::error::Official Lawnchair checkout has no gradlew."
            ls -la
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lawnchair
        working-directory: lawnchair-src
        run: |
          ./gradlew \
            --no-daemon \
            assembleLawnWithQuickstepGithubDebug \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-NothingOS-Debug
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
