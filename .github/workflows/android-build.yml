name: Lawnchair 16 - Nothing OS Widgets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nothing-launcher-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.daemon=false"
  ANDROID_HOME: "/usr/local/lib/android/sdk"

jobs:
  build:
    name: Build Lawnchair with Nothing OS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Nothing OS Source
        uses: actions/checkout@v4
        with:
          repository: amjrd/Nathing-os-5
          ref: main
          path: nathing-source
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Nothing OS Sources and Resources
        shell: bash
        run: |
          set -e
          echo "=== جاري مزامنة ملفات Nothing OS ==="
          SRC_BASE="nathing-source/app/src/main"
          DST_BASE="lawnchair-src/lawnchair/src"

          mkdir -p "$DST_BASE/com/example"

          if [ -d "$SRC_BASE/java/com/example" ]; then
            cp -rf "$SRC_BASE/java/com/example/"* "$DST_BASE/com/example/"
          elif [ -d "$SRC_BASE/kotlin/com/example" ]; then
            cp -rf "$SRC_BASE/kotlin/com/example/"* "$DST_BASE/com/example/"
          fi

          LAWN_RES="lawnchair-src/lawnchair/res"
          [ ! -d "$LAWN_RES" ] && LAWN_RES="lawnchair-src/lawnchair/src/main/res"

          if [ -d "$SRC_BASE/res" ] && [ -d "$LAWN_RES" ]; then
            cp -rn "$SRC_BASE/res/"* "$LAWN_RES/" || true
          fi

      - name: Inject Nothing AppWidgets into Lawnchair
        shell: bash
        run: |
          set -e
          echo "=== توليد وتفعيل ودجات Nothing OS في Lawnchair ==="

          DST_CODE="lawnchair-src/lawnchair/src/com/example/ui/components"
          mkdir -p "$DST_CODE"

          # 1. إنشاء ملف NothingWidgetProviders.kt
          cat << 'EOF' > "$DST_CODE/NothingWidgetProviders.kt"
          package com.example.ui.components

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.graphics.*
          import android.widget.RemoteViews
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.cos
          import kotlin.math.sin

          class NothingDigitalClockWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) updateClock(context, appWidgetManager, id)
              }
              companion object {
                  fun updateClock(context: Context, appWidgetManager: AppWidgetManager, id: Int) {
                      val pkg = context.packageName
                      val layoutId = context.resources.getIdentifier("widget_nothing_container", "layout", pkg)
                      val imgId = context.resources.getIdentifier("widget_image_view", "id", pkg)
                      if (layoutId == 0 || imgId == 0) return
                      val views = RemoteViews(pkg, layoutId)
                      
                      val bmp = Bitmap.createBitmap(600, 300, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#E6121212") }
                      canvas.drawRoundRect(RectF(10f, 10f, 590f, 290f), 48f, 48f, bg)
                      val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#33FFFFFF"); style = Paint.Style.STROKE; strokeWidth = 3f }
                      canvas.drawRoundRect(RectF(10f, 10f, 590f, 290f), 48f, 48f, stroke)
                      
                      val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                      val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textSize = 96f; typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD); textAlign = Paint.Align.CENTER }
                      canvas.drawText(time, 300f, 160f, textPaint)

                      val date = SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(Date()).uppercase()
                      val datePaint = Paint(Paint.ANTI_FLAG).apply { color = Color.parseColor("#D71921"); textSize = 28f; typeface = Typeface.DEFAULT_BOLD; textAlign = Paint.Align.CENTER }
                      canvas.drawText(date, 300f, 225f, datePaint)

                      views.setImageViewBitmap(imgId, bmp)
                      appWidgetManager.updateAppWidget(id, views)
                  }
              }
          }

          class NothingAnalogClockWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) updateAnalog(context, appWidgetManager, id)
              }
              companion object {
                  fun updateAnalog(context: Context, appWidgetManager: AppWidgetManager, id: Int) {
                      val pkg = context.packageName
                      val layoutId = context.resources.getIdentifier("widget_nothing_container", "layout", pkg)
                      val imgId = context.resources.getIdentifier("widget_image_view", "id", pkg)
                      if (layoutId == 0 || imgId == 0) return
                      val views = RemoteViews(pkg, layoutId)

                      val bmp = Bitmap.createBitmap(400, 400, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      val dial = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#F2000000") }
                      canvas.drawCircle(200f, 200f, 180f, dial)
                      val border = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#40FFFFFF"); style = Paint.Style.STROKE; strokeWidth = 3f }
                      canvas.drawCircle(200f, 200f, 180f, border)

                      val cal = Calendar.getInstance()
                      val h = cal.get(Calendar.HOUR)
                      val m = cal.get(Calendar.MINUTE)
                      val hAngle = Math.toRadians(((h + m / 60f) * 30).toDouble())
                      val mAngle = Math.toRadians((m * 6).toDouble())

                      val hp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; strokeWidth = 10f; strokeCap = Paint.Cap.ROUND }
                      canvas.drawLine(200f, 200f, 200f + 90f * sin(hAngle).toFloat(), 200f - 90f * cos(hAngle).toFloat(), hp)

                      val mp = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#D71921"); strokeWidth = 6f; strokeCap = Paint.Cap.ROUND }
                      canvas.drawLine(200f, 200f, 200f + 135f * sin(mAngle).toFloat(), 200f - 135f * cos(mAngle).toFloat(), mp)
                      canvas.drawCircle(200f, 200f, 8f, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE })

                      views.setImageViewBitmap(imgId, bmp)
                      appWidgetManager.updateAppWidget(id, views)
                  }
              }
          }
          EOF

          # 2. إنشاء ملفات الـ XML
          LAWN_RES="lawnchair-src/lawnchair/res"
          [ ! -d "$LAWN_RES" ] && LAWN_RES="lawnchair-src/lawnchair/src/main/res"

          mkdir -p "$LAWN_RES/layout" "$LAWN_RES/xml"

          cat << 'EOF' > "$LAWN_RES/layout/widget_nothing_container.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="4dp">
              <ImageView
                  android:id="@+id/widget_image_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter" />
          </FrameLayout>
          EOF

          cat << 'EOF' > "$LAWN_RES/xml/nothing_digital_clock_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="90dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="60000"
              android:initialLayout="@layout/widget_nothing_container"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > "$LAWN_RES/xml/nothing_analog_clock_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="140dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="60000"
              android:initialLayout="@layout/widget_nothing_container"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # 3. إدراج المكونات داخل AndroidManifest.xml باستخدام Python بأمان
          MANIFEST=$(find lawnchair-src/lawnchair -name "AndroidManifest.xml" | head -n 1)
          if [ -f "$MANIFEST" ]; then
            echo "تحديث ملف Manifest بأمان: $MANIFEST"
            python3 -c '
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          receivers = """
              <!-- Nothing OS Widgets -->
              <receiver android:name="com.example.ui.components.NothingDigitalClockWidgetProvider"
                  android:label="Nothing Dot Clock"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/nothing_digital_clock_info" />
              </receiver>
              <receiver android:name="com.example.ui.components.NothingAnalogClockWidgetProvider"
                  android:label="Nothing Analog Clock"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/nothing_analog_clock_info" />
              </receiver>
          """

          if "</application>" in content:
              content = content.replace("</application>", receivers + "\n</application>")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("تم حقن الودجات في Manifest بنجاح تام.")
          else:
              print("تحذير: لم يتم العثور على وسم </application>")
          ' "$MANIFEST"
          fi

          echo "=== اكتمال مرحلة التجهيز بنجاح ==="

      - name: Build Launcher APK
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew

          TASK="assembleLawnWithQuickstepGithubDebug"
          if ! ./gradlew tasks --all | grep -q "$TASK"; then
            TASK="assembleLawnWithQuickstepDebug"
          fi
          if ! ./gradlew tasks --all | grep -q "$TASK"; then
            TASK="assembleDebug"
          fi

          echo "المهمة الجاري تنفيذها: $TASK"
          ./gradlew --no-daemon --stacktrace --console=plain $TASK 2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload Launcher APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-16-Nothing-Widgets-APK
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build-full.log
          if-no-files-found: warn
          retention-days: 14
