name: Lawnchair 16 - Nothing OS Widgets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nothing-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair with Nothing OS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. جلب المستودع الحالي
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      # 2. جلب Lawnchair 16-dev
      - name: Checkout Lawnchair
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      # 3. جلب المصدر الأصلي لـ Nathing OS 5
      - name: Checkout original Nathing OS 5
        uses: actions/checkout@v4
        with:
          repository: amjrd/Nathing-os-5
          ref: main
          path: nathing-source
          fetch-depth: 1

      # 4. إعداد Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      # 5. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. فحص ملفات المصدر الأصلي
      - name: Verify original Nothing widgets
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"

          FILES=(
            "ui/components/NothingWidgets.kt"
            "ui/components/NothingAnalogClockWidget.kt"
            "ui/components/NosPortWidgets.kt"
            "model/LauncherModels.kt"
            "service/SystemPortHelper.kt"
            "service/SystemWidgetHostManager.kt"
            "ui/theme/Color.kt"
            "ui/theme/Theme.kt"
            "ui/theme/Type.kt"
            "util/VibrationHelper.kt"
          )

          for file in "${FILES[@]}"; do
            if [ ! -f "$SRC/$file" ]; then
              echo "::error::Original source file not found: $SRC/$file"
              exit 1
            fi
            echo "FOUND: $SRC/$file"
          done

          echo "All required original source files were found."

      # 7. نسخ ملفات Widgets الأصلية
      - name: Copy original Nothing widget sources
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"
          DST="lawnchair-src/lawnchair/src/com/example"

          mkdir -p \
            "$DST/ui/components" \
            "$DST/ui/theme" \
            "$DST/model" \
            "$DST/service" \
            "$DST/util"

          cp "$SRC/ui/components/NothingWidgets.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NothingAnalogClockWidget.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NosPortWidgets.kt" \
             "$DST/ui/components/"

          cp "$SRC/model/LauncherModels.kt" \
             "$DST/model/"

          cp "$SRC/service/SystemPortHelper.kt" \
             "$DST/service/"

          cp "$SRC/service/SystemWidgetHostManager.kt" \
             "$DST/service/"

          cp "$SRC/ui/theme/Color.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Theme.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Type.kt" \
             "$DST/ui/theme/"

          cp "$SRC/util/VibrationHelper.kt" \
             "$DST/util/"

          echo "Original source files copied."

      # 8. حفظ تقرير الملفات
      - name: Create integration report
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          {
            echo "Nothing OS widget integration report"
            echo "===================================="
            echo
            echo "Original source repository:"
            echo "amjrd/Nathing-os-5"
            echo
            echo "Target repository:"
            echo "LawnchairLauncher/lawnchair, branch 16-dev"
            echo
            echo "Copied Kotlin source files:"
            if [ -d lawnchair-src/lawnchair/src/com/example ]; then
              find lawnchair-src/lawnchair/src/com/example \
                -type f -name '*.kt' | sort
            fi
            echo
            echo "Note:"
            echo "Copying files does not by itself complete runtime integration."
          } > diagnostics/widget-integration-report.txt

      # 9. التحقق من Gradle
      - name: Verify Gradle project
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          chmod +x gradlew

      # 10. بناء التطبيق مع تسجيل جميع الأخطاء
      - name: Build and capture diagnostics
        working-directory: lawnchair-src
        shell: bash
        run: |
          set +e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleLawnWithQuickstepGithubDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "$BUILD_EXIT_CODE" \
            > "$GITHUB_WORKSPACE/diagnostics/build-exit-code.txt"

          {
            echo "## Build result"
            echo
            echo "Gradle exit code: $BUILD_EXIT_CODE"
            echo
            echo "## Compiler errors"
            grep -n -E \
              '(^e: |error:|Unresolved reference|What went wrong|Compilation error|FAILURE: Build failed)' \
              "$GITHUB_WORKSPACE/build-full.log" \
              | tail -n 100 || true
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$BUILD_EXIT_CODE"

      # 11. رفع APK إذا نجح البناء
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-Debug-APK
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # 12. رفع سجل البناء حتى عند الفشل
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-Build-Diagnostics
          path: |
            build-full.log
            diagnostics/
          if-no-files-found: warn
          retention-days: 14
