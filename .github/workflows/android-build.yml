      - name: Build Lawnchair and capture Kotlin errors
        working-directory: lawnchair-src
        shell: bash
        run: |
          set +e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleLawnWithQuickstepGithubDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          {
            echo "## Build diagnostics"
            echo "Gradle exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "### Compiler errors"
            grep -n -E \
              '(^e: |error:|Unresolved reference|What went wrong|Compilation error|FAILURE:)' \
              "$GITHUB_WORKSPACE/build-full.log" | tail -n 100 || true
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$BUILD_EXIT_CODE"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-Build-Diagnostics
          path: build-full.log
          if-no-files-found: warn
          retention-days: 14
