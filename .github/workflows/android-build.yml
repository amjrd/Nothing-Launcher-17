name: Lawnchair 16 - Nothing OS Widgets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nothing-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair with Nothing OS
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout original Nathing OS 5
        uses: actions/checkout@v4
        with:
          repository: amjrd/Nathing-os-5
          ref: main
          path: nathing-source
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify original Nothing widget sources
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"

          FILES=(
            "ui/components/NothingWidgets.kt"
            "ui/components/NothingAnalogClockWidget.kt"
            "ui/components/NosPortWidgets.kt"
            "ui/components/DotMatrix.kt"
            "model/LauncherModels.kt"
            "service/SystemPortHelper.kt"
            "service/SystemWidgetHostManager.kt"
            "ui/theme/Color.kt"
            "ui/theme/Theme.kt"
            "ui/theme/Type.kt"
            "util/VibrationHelper.kt"
          )

          for file in "${FILES[@]}"; do
            if [ ! -f "$SRC/$file" ]; then
              echo "::error::Original source file not found: $SRC/$file"
              exit 1
            fi

            echo "FOUND: $SRC/$file"
          done

          echo "All required original source files were found."

      - name: Copy original Nothing widget sources
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"
          DST="lawnchair-src/lawnchair/src/com/example"

          mkdir -p \
            "$DST/ui/components" \
            "$DST/ui/theme" \
            "$DST/model" \
            "$DST/service" \
            "$DST/util"

          # Original widgets
          cp "$SRC/ui/components/NothingWidgets.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NothingAnalogClockWidget.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NosPortWidgets.kt" \
             "$DST/ui/components/"

          # Required original dot-matrix implementation
          cp "$SRC/ui/components/DotMatrix.kt" \
             "$DST/ui/components/"

          # Supporting source files
          cp "$SRC/model/LauncherModels.kt" \
             "$DST/model/"

          cp "$SRC/service/SystemPortHelper.kt" \
             "$DST/service/"

          cp "$SRC/service/SystemWidgetHostManager.kt" \
             "$DST/service/"

          cp "$SRC/ui/theme/Color.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Theme.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Type.kt" \
             "$DST/ui/theme/"

          cp "$SRC/util/VibrationHelper.kt" \
             "$DST/util/"

          echo "Original widget sources and DotMatrix.kt copied."

          # Verify the missing declarations are now present
          grep -n -E \
            'fun DotMatrixClock|fun DotMatrixString' \
            "$DST/ui/components/DotMatrix.kt"

      - name: Verify Gradle project
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew

          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          chmod +x gradlew

      - name: Build and capture diagnostics
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleLawnWithQuickstepGithubDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Create build summary
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          if [ -f build-full.log ]; then
            {
              echo "## Build diagnostics"
              echo
              echo "### Compiler errors"
              grep -n -E \
                '(^e: |error:|Unresolved reference|What went wrong|Compilation error|FAILURE: Build failed)' \
                build-full.log | tail -n 100 || true
            } >> "$GITHUB_STEP_SUMMARY"

            cp build-full.log diagnostics/
          fi

          {
            echo "Nothing OS widget source report"
            echo
            echo "Original dot-matrix source: DotMatrix.kt"
            echo "Expected declarations: DotMatrixClock, DotMatrixString"
            echo
            echo "Source copying is not proof of runtime integration."
          } > diagnostics/widget-integration-report.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-Debug-APK
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-Build-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
