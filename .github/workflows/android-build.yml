name: Lawnchair 16 - Original Nothing OS Widgets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lawnchair-nothing-widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair with original Nothing widget sources
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout original Nathing OS 5 source
        uses: actions/checkout@v4
        with:
          repository: amjrd/Nathing-os-5
          ref: main
          path: nathing-source
          fetch-depth: 1

      - name: Verify original widget sources
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"

          for file in \
            "$SRC/ui/components/NothingWidgets.kt" \
            "$SRC/ui/components/NothingAnalogClockWidget.kt" \
            "$SRC/ui/components/NosPortWidgets.kt" \
            "$SRC/model/LauncherModels.kt" \
            "$SRC/ui/theme/Color.kt" \
            "$SRC/ui/theme/Theme.kt" \
            "$SRC/ui/theme/Type.kt" \
            "$SRC/service/SystemPortHelper.kt" \
            "$SRC/service/SystemWidgetHostManager.kt" \
            "$SRC/util/VibrationHelper.kt"; do

            if [ ! -f "$file" ]; then
              echo "::error::Missing original source file: $file"
              exit 1
            fi
          done

          echo "Original Nothing widget source files are present."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add original Nothing widget source to Lawnchair
        shell: bash
        run: |
          set -euo pipefail

          SRC="nathing-source/app/src/main/java/com/example"
          DST="lawnchair-src/lawnchair/src/com/example"

          mkdir -p \
            "$DST/ui/components" \
            "$DST/ui/theme" \
            "$DST/model" \
            "$DST/service" \
            "$DST/util"

          cp "$SRC/ui/components/NothingWidgets.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NothingAnalogClockWidget.kt" \
             "$DST/ui/components/"

          cp "$SRC/ui/components/NosPortWidgets.kt" \
             "$DST/ui/components/"

          cp "$SRC/model/LauncherModels.kt" \
             "$DST/model/"

          cp "$SRC/ui/theme/Color.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Theme.kt" \
             "$DST/ui/theme/"

          cp "$SRC/ui/theme/Type.kt" \
             "$DST/ui/theme/"

          cp "$SRC/service/SystemPortHelper.kt" \
             "$DST/service/"

          cp "$SRC/service/SystemWidgetHostManager.kt" \
             "$DST/service/"

          cp "$SRC/util/VibrationHelper.kt" \
             "$DST/util/"

          echo "Original widget source files copied."

          mkdir -p lawnchair-src/build

          {
            echo "Nothing OS original widget source report"
            echo
            find "$DST" -type f | sort
            echo
            echo "Source files copied; runtime integration must be verified."
          } > lawnchair-src/build/nothing-widget-integration-report.txt

      - name: Validate Lawnchair Gradle wrapper
        working-directory: lawnchair-src
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

      - name: Build Lawnchair debug APK
        working-directory: lawnchair-src
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleLawnWithQuickstepGithubDebug

      - name: Upload APK and integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Nothing-Original-Widget-Sources
          path: |
            lawnchair-src/**/build/outputs/apk/**/*.apk
            lawnchair-src/build/nothing-widget-integration-report.txt
          if-no-files-found: warn
          retention-days: 14
