name: Lawnchair 16 - Nothing OS Widget Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nothing-widget-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lawnchair with Nothing Clock Widget
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout Lawnchair 16-dev
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive

      - name: Add Nothing Clock and Date Widget
        shell: bash
        working-directory: lawnchair-src
        run: |
          set -euo pipefail

          mkdir -p lawnchair/src/app/lawnchair/nothing
          mkdir -p lawnchair/res/layout
          mkdir -p lawnchair/res/xml
          mkdir -p lawnchair/res/values

          cat > lawnchair/src/app/lawnchair/nothing/NothingClockWidget.java <<'EOF'
          package app.lawnchair.nothing;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.widget.RemoteViews;

          import com.android.launcher3.R;

          public final class NothingClockWidget extends AppWidgetProvider {

              @Override
              public void onUpdate(
                      Context context,
                      AppWidgetManager manager,
                      int[] appWidgetIds) {

                  for (int id : appWidgetIds) {
                      RemoteViews views = new RemoteViews(
                              context.getPackageName(),
                              R.layout.widget_nothing_clock
                      );

                      manager.updateAppWidget(id, views);
                  }
              }
          }
          EOF

          cat > lawnchair/res/layout/widget_nothing_clock.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_vertical"
              android:paddingStart="16dp"
              android:paddingEnd="16dp"
              android:paddingTop="8dp"
              android:paddingBottom="8dp">

              <TextClock
                  android:id="@+id/nothing_clock_time"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="h:mm"
                  android:format24Hour="HH:mm"
                  android:fontFamily="sans-serif-light"
                  android:textSize="48sp"
                  android:letterSpacing="0.02"
                  android:textColor="?android:attr/textColorPrimary"
                  android:includeFontPadding="false" />

              <TextClock
                  android:id="@+id/nothing_clock_date"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:format12Hour="EEEE, d MMMM"
                  android:format24Hour="EEEE, d MMMM"
                  android:fontFamily="sans-serif-medium"
                  android:textSize="14sp"
                  android:textColor="?android:attr/textColorSecondary"
                  android:includeFontPadding="false"
                  android:layout_marginTop="4dp" />

          </LinearLayout>
          EOF

          cat > lawnchair/res/xml/nothing_clock_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="90dp"
              android:minResizeWidth="140dp"
              android:minResizeHeight="70dp"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/widget_nothing_clock"
              android:description="@string/nothing_clock_widget_description" />
          EOF

          cat > lawnchair/res/values/nothing_clock_widget_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="nothing_clock_widget_label">Nothing Clock</string>
              <string name="nothing_clock_widget_description">Minimal Nothing-style clock and date</string>
          </resources>
          EOF

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("quickstep/AndroidManifest-launcher.xml")
          text = manifest.read_text(encoding="utf-8")

          receiver = """
              <receiver
                  android:name="app.lawnchair.nothing.NothingClockWidget"
                  android:label="@string/nothing_clock_widget_label"
                  android:exported="true"
                  android:permission="android.permission.BIND_APPWIDGET">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/nothing_clock_widget_info" />
              </receiver>
          """

          if "app.lawnchair.nothing.NothingClockWidget" in text:
              print("Nothing Clock receiver already exists.")
          else:
              marker = "</application>"
              if marker not in text:
                  raise SystemExit(
                      "ERROR: Cannot find </application> in launcher manifest."
                  )
              text = text.replace(marker, receiver + "\n" + marker, 1)
              manifest.write_text(text, encoding="utf-8")
              print("Nothing Clock receiver registered.")

          print("Manifest:", manifest)
          PY

          test -f lawnchair/src/app/lawnchair/nothing/NothingClockWidget.java
          test -f lawnchair/res/layout/widget_nothing_clock.xml
          test -f lawnchair/res/xml/nothing_clock_widget_info.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        working-directory: lawnchair-src
        run: |
          test -f gradlew
          chmod +x gradlew

      - name: Build Lawnchair
        working-directory: lawnchair-src
        run: |
          ./gradlew \
            --no-daemon \
            assembleLawnWithQuickstepGithubDebug \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-NothingOS-Clock-Debug
          path: lawnchair-src/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NothingOS-Widget-Build-Logs
          path: |
            lawnchair-src/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
