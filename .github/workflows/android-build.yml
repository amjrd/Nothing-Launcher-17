name: Nothing Launcher 17 - Widget Fix Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/android-build.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: nothing-launcher-widget-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nothing Launcher 17
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project files
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Required project files found."

      - name: Validate Android resources
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          roots = [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res",
          ]

          files = []

          for root in roots:
              if os.path.isfile(root) and root.endswith(".xml"):
                  files.append(root)
              elif os.path.isdir(root):
                  for directory, _, filenames in os.walk(root):
                      for filename in filenames:
                          if filename.endswith(".xml"):
                              files.append(os.path.join(directory, filename))

          for path in files:
              try:
                  ET.parse(path)
              except Exception as error:
                  raise SystemExit(
                      f"Invalid XML: {path}\n{error}"
                  )

          print(f"Validated {len(files)} XML files.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK output
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Launcher-17-Widget-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
